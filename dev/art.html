<!doctype html><meta charset="utf-8"><title>art</title>

<div class="g" id="g"></div>
<script src="../js/support.js"></script><script src="../js/icons.js"></script><script src="../js/art.js"></script>
<script>const A=window.AIQ;document.getElementById('g').innerHTML=Object.keys(A.ART).map(k=>`<div class="c">${A.art(k)}<span>${k}</span></div>`).join('')</script>
