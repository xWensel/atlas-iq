<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Don Crupier - hoja de expresiones</title>
<style>
  :root { --bg: #1d1730; --card: #2a2146; --ink: #f6ecd8; --dim: #b3a6d6; --gold: #ffd84a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 system-ui, sans-serif; padding: 20px; }
  h1 { font-size: 22px; margin: 0 0 4px; } h2 { font-size: 17px; margin: 28px 0 10px; color: var(--gold); }
  p.sub { margin: 0 0 16px; color: var(--dim); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; }
  .cell { background: var(--card); border-radius: 10px; padding: 10px 10px 12px; }
  .slot { width: 256px; height: 256px; margin: 0 auto; position: relative; }
  .slot canvas { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); image-rendering: pixelated; }
  .cell b { display: block; font-size: 16px; margin-top: 6px; } .cell span { color: var(--dim); font-size: 13px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
  button { background: #3b2f63; color: var(--ink); border: 0; border-radius: 6px; padding: 7px 11px; font: inherit; cursor: pointer; }
  button:hover { background: #4d3e80; }
  .big { display: flex; gap: 20px; align-items: flex-end; flex-wrap: wrap; }
  .big .slot { width: 384px; height: 384px; }
</style>
</head>
<body>
<h1>Don Crupier</h1>
<p class="sub">Motor real del juego (js/crupier.js), escala entera de pixel. Todas las caras hablan cada pocos segundos.</p>
<h2>Gestos</h2>
<div class="big"><div class="slot" id="stage"></div><div><div class="row" id="gbtn"></div><div class="row" id="ebtn"></div><div class="row"><button id="say">Hablar</button></div></div></div>
<h2>Expresiones</h2>
<div class="grid" id="grid"></div>
<script src="../js/crupier-data.js"></script>
<script src="../js/crupier.js"></script>
<script>
const A = window.AIQ;
const NAMES = { sly: "Picaro", laugh: "Carcajada", angry: "Enfado", shock: "Sorpresa", smug: "Presumido", wink: "Guino", suspicious: "Sospecha", sad: "Pena",
  nervous: "Nervioso", innocent: "Yo no he sido", bored: "Aburrido", deadpan: "Impasible", sleep: "Dormido", boss: "El jefe" };
const grid = document.getElementById("grid"), sprites = [];
for (const id of A.crupier.list()) {
  const c = document.createElement("div"); c.className = "cell";
  c.innerHTML = `<div class="slot"></div><b>${NAMES[id] || id}</b><span>${id}</span>`; grid.appendChild(c);
  const s = A.crupier.mount(c.querySelector(".slot"), { round: true }); s.set(id, { quiet: true }); sprites.push(s);
}
const stage = A.crupier.mount(document.getElementById("stage"), { round: true });
function talk(s, ms) { s.talk(true); let n = 0; const t = setInterval(() => { s.syl(); if ((n += 70) > ms) { clearInterval(t); s.talk(false); } }, 70); }
sprites.forEach((s, i) => setInterval(() => talk(s, 1600), 5200 + i * 300));
const gb = document.getElementById("gbtn");
for (const g of A.crupier.gestures()) { const b = document.createElement("button"); b.textContent = g; b.onclick = () => stage.play(g); gb.appendChild(b); }
const eb = document.getElementById("ebtn");
for (const e of A.crupier.list()) { const b = document.createElement("button"); b.textContent = NAMES[e] || e; b.onclick = () => stage.set(e); eb.appendChild(b); }
document.getElementById("say").onclick = () => talk(stage, 2200);
window.__cr = { stage, sprites };
</script>
</body>
</html>
