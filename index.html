<!DOCTYPE html>
<html lang="es" data-skin="casino">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f3b3a">
<title>Atlas IQ</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2314232b'/%3E%3Cpath d='M32 6l6 20 20 6-20 6-6 20-6-20-20-6 20-6z' fill='%23f2e9d6'/%3E%3Cpath d='M32 6l4 22-4 4-4-4z' fill='%23e0492b'/%3E%3C/svg%3E">
<link rel="preload" as="image" href="assets/gen/logo.webp">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/boot.css">
<link rel="stylesheet" href="css/skins.css">
<link rel="stylesheet" href="css/codex.css">
<link rel="stylesheet" href="css/hub.css">
<link rel="stylesheet" href="css/premium.css">
<link rel="stylesheet" href="css/challenges.css">
<link rel="stylesheet" href="css/uikit.css">
<style>
/* pantalla de carga: se ve al instante, antes de que se descarguen los datos y se construya el mapa */
#splash{position:fixed;inset:0;z-index:99999;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 45%,#231340,#0c0a18 70%);transition:opacity .45s ease}
#splash.out{opacity:0;pointer-events:none}
#splash div{text-align:center}#splash img{width:min(340px,70vw);height:auto;image-rendering:pixelated}
#splash i{display:block;width:130px;height:5px;margin:22px auto 0;background:#2c1b52;overflow:hidden;position:relative}
#splash i::after{content:"";position:absolute;top:0;bottom:0;width:40%;background:#f8b449;animation:splb 1.1s ease-in-out infinite}
@keyframes splb{0%{left:-40%}100%{left:100%}}
</style>
</head>
<body>
<div id="splash" aria-hidden="true"><div><img src="assets/gen/logo.webp" alt=""><i></i></div></div>
<script>setTimeout(function(){var e=document.getElementById("splash");if(e)e.remove()},20000)</script>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="rose" viewBox="-50 -50 100 100">
    <circle r="44" fill="none" stroke="currentColor" stroke-width="2.2"/>
    <circle r="38" fill="none" stroke="currentColor" stroke-width=".8"/>
    <path d="M0-48L7-7 48 0 7 7 0 48-7 7-48 0-7-7z" fill="currentColor"/>
    <path d="M0-48L7-7 0 0z" fill="var(--rose-accent,#e0492b)"/>
    <path d="M34-34L4-4-4 4z M-34-34L-4-4 4 4z M34 34L4 4-4-4z M-34 34L-4 4 4-4z" fill="currentColor" opacity=".55" transform="scale(.62)"/>
    <circle r="4" fill="var(--rose-hole,#f2e9d6)"/>
  </symbol>
  <filter id="handcut" x="-4%" y="-4%" width="108%" height="108%"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="4.5"/></filter>
  <filter id="rough" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".05" numOctaves="3" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3.2"/></filter>
</svg>

<div id="app">
  <canvas id="map" aria-label="Mapa del mundo"></canvas>
  <div id="grain"></div>
  <div class="vignette"></div>

  <header id="hud">
    <div class="sh brand-sh"><div class="cut ink brand">
      <svg class="brand-rose"><use href="#rose"/></svg>
      <div class="brand-txt"><b>Atlas</b><i>IQ</i></div>
    </div></div>

    <div class="sh plate-sh"><section id="plate" class="cut paper hidden">
      <div class="plate-top"><span id="askNo"></span><span id="askKind" class="tag" data-tf="kind"></span></div>
      <h2 id="askName"></h2>
      <p id="askSub"></p>
      <div class="clock" data-tf="clock"><div class="ruler"><i id="timeFill"></i></div><b id="timeTxt">10.0</b></div>
      <div id="pips" data-tf="pips"></div>
    </section></div>

    <div class="sh ledger-sh" id="ledgerSh"><section class="cut paper ledger" id="ledger">
      <div class="lg-label" data-i="score.level"></div>
      <div class="lg-num odo" id="scLevel" data-tf="level">0</div>
      <div class="gauge" data-tf="need"><i id="scBar"></i><em id="scMark"></em></div>
      <div class="lg-row"><span data-tf="need"><span data-i="score.need"></span> <b id="scNeed">0</b></span><span data-tf="total"><span data-i="score.total"></span> <b id="scTotal">0</b></span></div>
      <div id="streakChip" class="hidden" data-tf="streak"></div>
    </section></div>
  </header>

  <!-- carril de zoom -->
  <div class="sh rail-sh" id="railSh"><aside id="rail" class="cut ink">
    <button id="zoomIn" data-tip="tip.in" data-key="+" aria-label="Acercar"><i class="uic" data-ic="u_plus"></i></button>
    <div class="zscale" aria-hidden="true"><i id="zoomFill"></i></div>
    <button id="zoomOut" data-tip="tip.out" data-key="−" aria-label="Alejar"><i class="uic" data-ic="u_minus"></i></button>
    <button id="zoomHome" data-tip="tip.home" data-key="0" aria-label="Vista inicial"><i class="uic" data-ic="u_home"></i></button>
  </aside></div>

  <!-- dock inferior -->
  <div class="sh dock-sh" id="dockSh"><nav id="dock" class="cut ink">
    <button id="setBtn" data-tip="tip.set" aria-label="Ajustes" aria-expanded="false"><i class="uic" data-ic="u_set"></i></button>
    <button id="pauseBtn" class="hidden" data-tip="tip.pause" data-key="P" aria-label="Pausa"><i class="uic" data-ic="u_pause"></i></button>
    <button id="fsBtn" data-tip="tip.fs" data-key="F" aria-label="Pantalla completa"><i class="uic" data-ic="u_fs"></i></button>
  </nav></div>

  <!-- nota de campo (curiosidad) -->
  <div class="sh note-sh" id="noteSh"><footer id="note" class="cut paper">
    <span id="lvlText"></span>
    <p id="factText"></p>
  </footer></div>

  <!-- panel de ajustes: cuatro pestanas cortas -->
  <div class="sh set-sh hidden" id="setSh"><section id="settings" class="cut ink" role="dialog" aria-label="Ajustes">
    <div class="set-head"><span data-i="set.title"></span><button id="setClose" aria-label="Cerrar"><i class="uic" data-ic="u_close"></i></button></div>
    <div class="seg s4 set-tabs" data-seg="settab"><button type="button" data-v="general" data-i="set.tab.general"></button><button type="button" data-v="sound" data-i="set.tab.sound"></button><button type="button" data-v="video" data-i="set.tab.video"></button><button type="button" data-v="data" data-i="set.tab.data"></button><i></i></div>

    <div class="set-pane" data-pane="general">
      <div class="set-sec"><h3 data-i="set.lang"></h3>
        <div class="langgrid" id="langGrid"></div>
        <p class="set-note" data-i="set.lang.note"></p>
      </div>
      <div class="set-sec">
        <button class="row-btn" id="setFs" type="button"><span data-i="key.fs"></span><kbd>F</kbd></button>
        <div class="row-sw"><div class="rs-t"><label data-i="set.intro"></label></div><button class="sw" data-sw="intro" role="switch" aria-checked="true" aria-label="Intro del estudio"><i></i></button></div>
      </div>
    </div>

    <div class="set-pane hidden" data-pane="sound">
      <div class="set-sec">
        <div class="fader" data-k="master"><label data-i="vol.master"></label><output>85</output><input type="range" min="0" max="100" value="85" aria-label="Volumen general"><div class="ftrack"></div></div>
        <div class="fader" data-k="music"><label data-i="vol.music"></label><button class="sw" data-sw="music" role="switch" aria-checked="true" aria-label="Música"><i></i></button><output>70</output><input type="range" min="0" max="100" value="70" aria-label="Volumen de la música"><div class="ftrack"></div></div>
        <div class="np np-set" id="setSong"><button type="button" class="np-b" data-d="-1" data-tf="songprev"><i class="np-tri l"></i></button><span class="np-t"><i class="np-note">&#9834;</i><b data-np-t></b><em data-np-n></em></span><button type="button" class="np-b" data-d="1" data-tf="songnext"><i class="np-tri r"></i></button></div>
        <div class="fader" data-k="sfx"><label data-i="vol.sfx"></label><button class="sw" data-sw="sfx" role="switch" aria-checked="true" aria-label="Efectos"><i></i></button><output>90</output><input type="range" min="0" max="100" value="90" aria-label="Volumen de los efectos"><div class="ftrack"></div></div>
      </div>
      <div class="set-sec">
        <div class="row-sw"><div class="rs-t"><label data-i="set.songs"></label><small data-i="set.songs.d"></small></div><button class="sw" data-sw="songs" role="switch" aria-checked="true" aria-label="Aviso de canciones"><i></i></button></div>
      </div>
    </div>

    <div class="set-pane hidden" data-pane="video">
      <div class="set-sec"><h3 data-i="set.gfx"></h3>
        <div class="seg s3" data-seg="gfx"><button data-v="auto" data-i="gfx.auto"></button><button data-v="high" data-i="gfx.high"></button><button data-v="saver" data-i="gfx.saver"></button><i></i></div>
        <p class="set-note" data-i="set.gfx.d"></p>
      </div>
      <div class="set-sec">
        <div class="row-sw"><div class="rs-t"><label data-i="set.motion"></label><small data-i="set.motion.d"></small></div><button class="sw" data-sw="motion" role="switch" aria-checked="false" aria-label="Reducir movimiento"><i></i></button></div>
        <div class="row-sw" id="rowCursor"><div class="rs-t"><label data-i="set.cursor"></label><small data-i="set.cursor.d"></small></div><button class="sw" data-sw="cursor" role="switch" aria-checked="true" aria-label="Puntero de casino"><i></i></button></div>
        <div class="row-sw"><div class="rs-t"><label data-i="set.tips"></label><small data-i="set.tips.d"></small></div><button class="sw" data-sw="tips" role="switch" aria-checked="true" aria-label="Ayudas emergentes"><i></i></button></div>
      </div>
    </div>

    <div class="set-pane hidden" data-pane="data">
      <div class="set-sec">
        <button class="row-btn danger" id="resetCodex" type="button"></button>
        <p class="set-note" id="resetCodexNote"></p>
      </div>
      <div class="set-sec">
        <button class="row-btn danger" id="resetSet" type="button"></button>
        <p class="set-note" id="resetSetNote"></p>
      </div>
    </div>

    <div class="set-keys"><span><kbd>F</kbd> <em data-i="key.fs"></em></span><span><kbd>P</kbd> <em data-i="key.pause"></em></span><span><kbd>M</kbd> <em data-i="key.sfx"></em></span><span><kbd>N</kbd> <em data-i="key.mus"></em></span><span><kbd>&larr;</kbd><kbd>&rarr;</kbd> <em data-i="key.song"></em></span></div>
  </section></div>


  <!-- entrada: idioma + pantalla completa, y despues la intro del estudio -->
  <div id="boot" class="hidden">
    <div class="gate" id="gate">
      <div class="gate-glow"></div>
      <div class="gate-logo" id="gateLogo"><img src="assets/gen/logo.webp" alt="Atlas IQ"></div>
      <div class="gate-opts">
        <div class="gate-langs" id="gateLangs"></div>
        <button class="gate-fs" id="gateFs" type="button" role="switch" aria-checked="true"><i class="uic" data-ic="u_fs"></i><span data-i="boot.fs"></span><i class="sw-mini"></i></button>
      </div>
      <button class="gate-enter" id="gateEnter" type="button"><span data-i="boot.enter"></span></button>
    </div>
    <div class="studio hidden" id="studio" aria-label="Vault Raiders">
      <div class="st-bg"></div>
      <div class="st-logo" id="stLogo"></div>
      <div class="st-skip" data-i="boot.skip"></div>
    </div>
  </div>
  <div id="langPop" class="langpop hidden" role="menu"><div class="langgrid" id="langPopGrid"></div></div>

  <div id="tip" class="hidden"></div>

  <div id="layer" class="hidden"><section id="dlg"></section></div>
  <div id="intro" class="hidden"></div>
  <div id="veil" class="hidden"></div>
</div>

<script src="js/vendor/topojson-client.min.js"></script>
<script src="data/world.js"></script>
<script src="data/classic.js"></script>
<script src="data/locations.js"></script>
<script src="data/history.js"></script>
<script src="data/codex.js"></script>
<script src="data/places.js"></script>
<script src="data/classic-tr.js"></script>
<script src="data/campaigns.js"></script>
<script src="js/geo.js"></script>
<script src="js/i18n.js"></script>
<script src="js/logo.js"></script>
<script src="js/support.js"></script>
<script src="js/i18n2.js"></script>
<script src="js/i18n3.js"></script>
<script src="js/i18n4.js"></script>
<script src="js/i18n5.js"></script>
<script src="js/audio.js"></script>
<script src="js/vendor/earcut.min.js"></script>
<script src="js/map2d.js"></script>
<script src="js/map.js"></script>
<script src="js/icons.js"></script>
<script src="js/art.js"></script>
<script src="js/skins.js"></script>
<script src="js/profile.js"></script>
<script src="js/rank.js"></script>
<script src="js/relics.js"></script>
<script src="js/challenges.js"></script>
<script src="js/dealer.js"></script>
<script src="js/pointer.js"></script>
<script src="js/uikit.js"></script>
<script src="js/tips.js"></script>
<script src="js/jukebox.js"></script>
<script src="js/adventure.js"></script>
<script src="js/hub.js"></script>
<script src="js/wiki.js"></script>
<script src="js/codex.js"></script>
<script src="js/game.js"></script>
</body>
</html>
